name: Update dataset URL manifest

# Keeps inst/extdata/manifest/v1/datasets_link.csv fresh so that broken
# source URLs (MapBiomas collection bumps, PRODES year rollovers, BACI
# version stamps, ANEEL CDE years, EPE publication IDs) can be fixed in
# minutes instead of waiting for a CRAN release.
#
# NOTE (as of the webscrapping_beta branch): this workflow is written to be
# fully operational, but it has never been pushed to GitHub, so it has never
# run. Activating it is a separate, explicit decision -- see the activation
# checklist in WEBSCRAPING_BETA_REPORT.pdf. Until that happens this file is
# documentation of the intended production behavior, exercised locally via
# `Rscript actions/scripts/build_manifest.R --dry-run` (same code path,
# writes only to tempdir()).

on:
  schedule:
    # Monday 05:00 UTC -- clear of the existing monthly check-dz-amazonia.yaml
    # (1st of the month, 03:00 UTC), so the two never compete for runners.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: update-manifest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install resolver dependencies
        run: |
          Rscript -e 'install.packages(c("readr","dplyr","tibble","purrr","stringr","jsonlite","curl","devtools"))'

      - name: Run build_manifest.R
        id: build
        run: |
          set +e
          # --skip seeg: the seeg resolver works fine locally (verified with a
          # browser User-Agent) but returns HTTP 403 specifically when run from
          # a GitHub Actions runner -- most likely IP-range/WAF blocking on
          # SEEG's side, confirmed by a live manual run of this workflow. Until
          # that's resolved, excluding it here keeps the other six resolvers
          # running and auto-committing/PR-ing normally instead of failing the
          # whole job with exit 30 every week. Remove this flag once seeg is
          # reachable from CI again -- see WEBSCRAPING_BETA_REPORT.
          Rscript --vanilla actions/scripts/build_manifest.R --skip seeg
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate manifest (Tier A / no-change path only)
        if: steps.build.outputs.exit_code == '0'
        env:
          DZ_CANDIDATE: ${{ steps.build.outputs.candidate_path }}
        run: |
          Rscript -e 'options(datazoom.amazonia.manifest_url = paste0("file://", Sys.getenv("DZ_CANDIDATE")), datazoom.amazonia.use_remote_manifest = TRUE)' \
                  -e 'devtools::load_all("."); datazoom.amazonia:::clear_manifest_cache(); print(nrow(datazoom.amazonia:::link_table()))'

      - name: Commit Tier A refresh
        if: steps.build.outputs.exit_code == '0'
        run: |
          if ! git diff --quiet -- inst/extdata/manifest/v1/datasets_link.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add inst/extdata/manifest/v1/datasets_link.csv
            git commit -m "chore(manifest): refresh URLs [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Stage Tier B candidate onto the committed manifest path
        if: steps.build.outputs.exit_code == '10'
        run: |
          cp "${{ steps.build.outputs.candidate_path }}" inst/extdata/manifest/v1/datasets_link.csv

      - name: Open PR for Tier B changes
        if: steps.build.outputs.exit_code == '10'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(manifest): candidate refresh needs review"
          title: "Manifest refresh: review needed (Tier B changes)"
          body: |
            One or more resolvers found a change that may affect the SHAPE of
            downloaded data (a new collection/version token, an added or
            removed row, a changed sheet/archive_file/available_time). These
            are never auto-committed -- see manifest_report.json in the run
            artifacts for the full diff and HTTP validation report.

            Checklist before merging:
            - [ ] Confirm the new URL(s) actually serve the expected data
            - [ ] Re-run the affected `check-load-<source>.yaml` workflow
            - [ ] If a collection/version bump, check whether R/*.R hardcodes
                  anything that also needs to change (sheet names, raster
                  legend codes -- see prodes.R, mapbiomas.R, epe.R)
          branch: manifest-refresh-review
          labels: manifest
          add-paths: inst/extdata/manifest/v1/datasets_link.csv

      - name: Open issue on validation/resolver failure
        if: steps.build.outputs.exit_code == '20' || steps.build.outputs.exit_code == '30'
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = "${{ steps.build.outputs.exit_code }}";
            const title = exitCode === "20"
              ? "Manifest refresh: validation failed"
              : "Manifest refresh: one or more resolvers failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "manifest"
            });
            if (existing.some(i => i.title === title)) {
              console.log("An open issue with this title already exists; skipping.");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["manifest"],
              body: "See the `Run build_manifest.R` step log in this workflow run for the full report."
            });

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: |
            ${{ steps.build.outputs.report_path }}
            ${{ steps.build.outputs.candidate_path }}
          if-no-files-found: ignore

      - name: Fail the run if build_manifest.R signaled a problem
        if: steps.build.outputs.exit_code != '0' && steps.build.outputs.exit_code != '10'
        run: exit 1
