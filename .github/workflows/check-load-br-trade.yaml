name: Check load_br_trade

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: System dependencies (sf/units)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            gdal-bin \
            proj-bin \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
          needs: check

      # load_br_trade() downloads from balanca.mdic.gov.br, which omits its
      # intermediate CA: without this, OpenSSL on this runner stops with
      # "unable to get local issuer certificate". See the action's header.
      - name: Trust SERPRO's intermediate CA (balanca.mdic.gov.br omits it)
        uses: ./.github/actions/trust-serpro-intermediate
        continue-on-error: true

      - name: Run checks for load_br_trade
        run: |
          Rscript --vanilla actions/scripts/check_all_loads.R --fn load_br_trade

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-load_br_trade
          path: check_results_load_br_trade_*.csv