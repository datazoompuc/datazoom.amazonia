name: Trust SERPRO's intermediate CA
description: >
  Adds the intermediate certificate(s) that balanca.mdic.gov.br (COMEX) fails to
  send to the runner's TLS trust store, found from the AIA URL in the server's
  own certificate and accepted only if the whole chain verifies against the
  runner's own roots. TLS verification is never disabled.

# balanca.mdic.gov.br (COMEX) sends only its leaf TLS certificate, not the
# intermediate CA that issued it ("AC SERPRO AR46 OV TLS CA 2025" today).
# Windows and browsers fetch a missing intermediate themselves (AIA); OpenSSL,
# which R's curl uses on an Ubuntu runner, does not, so without this step every
# download from that host stops with "unable to get local issuer certificate".
# Reproduced 2026-10-17 and again 2026-10-21 (libcurl+OpenSSL with the stock
# Ubuntu 22.04/24.04 ca-certificates bundles, none of which contains it).
# Of the 22 hosts the manifest points at, only the two balanca.* hosts have this
# problem (scan of 2026-10-18); this step does nothing for balanca.economia.gov.br
# (expired certificate, a different CA) or for SEEG (a WAF 403, not TLS).
#
# WHAT THE SCRIPT DOES (trust-intermediate.sh, next to this file -- read its
# header): reads the certificate the server presents, follows the AIA "CA
# Issuers" URL(s) in it like a browser (up to 4 hops), and installs what it
# downloaded ONLY if leaf <- downloaded certificate(s) <- a root in
# /etc/ssl/certs/ca-certificates.crt verifies, including signatures, dates,
# serverAuth purpose and the host name. That check, not the plain-http download,
# is what makes it safe. Until 2026-10-21 this step downloaded one hard-coded
# URL and refused any certificate whose name was not exactly the one expected;
# a rotation of SERPRO's intermediate would then have stopped CI until someone
# edited a string. The URL is now read from the certificate, and the script also
# compares the intermediate it found with the one bundled for R users in
# inst/extdata/tls/balanca-serpro-chain.pem -- because a CI that heals itself
# would otherwise hide that the package's own copy has gone stale. When it has,
# the script warns; and when the caller sets `refresh-bundled-chain: true`
# (update-manifest.yaml, weekly) it also rewrites that file (refresh-bundled-
# chain.sh, next to it: root(s) kept, the new intermediate in, accepted only if
# the new file verifies the live host by itself) and exposes `chain-stale` and
# `pr-body-path`, so the workflow can open a pull request instead of leaving the
# warning for nobody to read. The two check workflows do not pass the input: they
# have no write permission, and one pull request a week is enough. If the host's
# chain now leads to a root the bundle does not carry, nothing is rewritten and
# the warning stays: that needs a person.
#
# THIS STEP DOES NOT HELP A USER. It only patches the trust store of the runner
# it runs on, for the length of the job. Since 2026-10-21 R/balanca_tls.R gives
# load_br_trade() and load_baci() their own certificate-error fallback, so R
# code no longer needs this step to read balanca.mdic.gov.br. Callers that still
# need it are those whose code talks to the host with its own curl calls: the
# manifest resolvers (update-manifest.yaml). The two check workflows
# (check-load-br-trade.yaml and the load_br_trade job of check-dz-amazonia.yaml)
# keep it for now, but while it is there they no longer test what a user
# experiences -- the runner trusts the host regardless of the R fallback. Drop it
# from them once the fallback has been seen to work on a real runner.
#
# Callers should set `continue-on-error: true`: if a check or the download
# fails, only the COMEX downloads are affected, and their own error message
# names this exact problem. Used by update-manifest.yaml, check-load-br-trade.yaml
# and check-dz-amazonia.yaml (the last only for the load_br_trade job). It needs
# a checkout first (a local action lives in the repository). test-comex-resolver.R
# checks the wiring and the safety properties.

inputs:
  refresh-bundled-chain:
    description: >
      'true': when the intermediate the server presents is not in the chain bundled
      for R users (inst/extdata/tls/balanca-serpro-chain.pem), rewrite that file in
      the workspace and set the outputs below, so that the CALLER can open a pull
      request. The caller's job needs contents: write and pull-requests: write
      (update-manifest.yaml has them). Default 'false': a warning annotation only.
    required: false
    default: "false"

outputs:
  chain-stale:
    description: "'true' if the bundled chain was rewritten in the workspace (empty otherwise)"
    value: ${{ steps.trust.outputs.chain-stale }}
  pr-body-path:
    description: Path of a file holding the pull request description (set with chain-stale)
    value: ${{ steps.trust.outputs.pr-body-path }}

runs:
  using: composite
  steps:
    - id: trust
      name: Find, verify and trust the missing intermediate certificate(s)
      shell: bash
      env:
        TRUST_REFRESH: ${{ inputs.refresh-bundled-chain }}
      run: bash "${{ github.action_path }}/trust-intermediate.sh"
